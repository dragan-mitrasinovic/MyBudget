root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/mybudget ./cmd/mybudget"
entrypoint = ["./tmp/mybudget"]
include_ext = ["go", "sql"]
include_file = ["go.mod", "go.sum"]
exclude_dir = ["tmp"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 200
stop_on_error = false
send_interrupt = true
kill_delay = "500ms"

[misc]
clean_on_exit = true