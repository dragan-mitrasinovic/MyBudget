<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MyBudget</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (() => {
        const appThemes = [
          'soft-ledger',
          'color-coded-studio',
          'bright-utility',
          'signal-red',
          'midnight-terminal',
          'candy-pop',
          'velvet-night',
          'vaporwave',
        ];
        let appTheme = 'soft-ledger';

        try {
          const preference = localStorage.getItem('mybudget.theme');
          if (preference === 'light' || preference === 'dark') {
            document.documentElement.dataset['theme'] = preference;
          }

          const storedAppTheme = localStorage.getItem('mybudget.app-theme');
          if (appThemes.includes(storedAppTheme)) {
            appTheme = storedAppTheme;
          }
        } catch {
          // Browser policy can disable storage; defaults remain active.
        }

        document.documentElement.dataset['appTheme'] = appTheme;
      })();
    </script>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
