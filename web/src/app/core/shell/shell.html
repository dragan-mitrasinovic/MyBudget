@if (user(); as u) {
  <mat-toolbar class="app-bar">
    <span class="app-name">MyBudget</span>
    <span class="spacer"></span>
    <button mat-icon-button type="button" aria-label="Log out" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="shell">
    <mat-sidenav class="side-nav" mode="side" opened>
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/budgets"
          routerLinkActive
          #budgetsLink="routerLinkActive"
          [activated]="budgetsLink.isActive"
        >
          <mat-icon matListItemIcon>account_balance_wallet</mat-icon>
          <span matListItemTitle>Budgets</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
}
