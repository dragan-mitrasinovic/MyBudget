@if (user(); as u) {
  <mat-toolbar class="app-bar">
    @if (isHandset()) {
      <button
        mat-icon-button
        type="button"
        class="nav-toggle"
        aria-label="Open navigation"
        (click)="sideNav.toggle()"
      >
        <mat-icon>menu</mat-icon>
      </button>
    }
    <span class="app-name">MyBudget</span>
    <span class="spacer"></span>
    <button mat-icon-button type="button" aria-label="Log out" (click)="logout()">
      <mat-icon>logout</mat-icon>
    </button>
  </mat-toolbar>

  <mat-sidenav-container class="shell">
    <mat-sidenav
      #sideNav
      class="side-nav"
      [mode]="isHandset() ? 'over' : 'side'"
      [opened]="!isHandset()"
    >
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/budgets"
          routerLinkActive
          #budgetsLink="routerLinkActive"
          [activated]="budgetsLink.isActive"
          (click)="closeNavigationOnHandset(sideNav)"
        >
          <mat-icon matListItemIcon>account_balance_wallet</mat-icon>
          <span matListItemTitle>Budgets</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="content">
      <router-outlet />
    </mat-sidenav-content>
  </mat-sidenav-container>
}
