@if (user(); as u) {
  <div class="home">
    <mat-card class="home-card" appearance="outlined">
      <mat-card-content class="home-content">
        <img class="avatar" [src]="u.picture" [alt]="u.name" referrerpolicy="no-referrer" />
        <h1>Hello, {{ u.name }}</h1>
        <p>{{ u.email }}</p>
        <button mat-flat-button type="button" (click)="logout()">Log out</button>
      </mat-card-content>
    </mat-card>
  </div>
}
